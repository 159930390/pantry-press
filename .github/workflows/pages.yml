name: Publish Pantry Press
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /pantry-press
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify the published home and recipe pages
        env:
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          for route in "" "projects/chilli-noodles/" "projects/mango-rice/" "projects/chilli-wontons/"; do
            curl --fail --show-error --location --retry 6 --retry-all-errors --retry-delay 5 "${SITE_URL%/}/$route" -o /tmp/press-page.html
            grep -Fq "Pantry Press" /tmp/press-page.html
          done
