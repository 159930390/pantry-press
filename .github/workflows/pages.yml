name: Publish Pantry Press
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /pantry-press
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://lunkesheieulwxbveicf.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_-0OMl9aPDH91Ds6aYKv0vw_-EDcgjWO' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify the published home and recipe pages
        env:
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          for route in "" "projects/chilli-noodles/" "projects/mango-rice/" "projects/chilli-wontons/"; do
            curl --fail --show-error --location --retry 6 --retry-all-errors --retry-delay 5 "${SITE_URL%/}/$route" -o /tmp/press-page.html
            grep -Fq "Pantry Press" /tmp/press-page.html
          done
      - name: Check Supabase connectivity
        env:
          PROJECT_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://lunkesheieulwxbveicf.supabase.co' }}
          PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_-0OMl9aPDH91Ds6aYKv0vw_-EDcgjWO' }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          for name, path in [('Auth','/auth/v1/settings'),('Folios','/rest/v1/folios?select=id&limit=0'),('Press','/functions/v1/press')]:
              request = urllib.request.Request(os.environ['PROJECT_URL'] + path, headers={'apikey': os.environ['PUBLISHABLE_KEY']})
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      print(name, response.status)
                      if name == 'Auth':
                          data = json.load(response)
                          print('Email provider enabled:', data.get('external', {}).get('email'))
              except urllib.error.HTTPError as error:
                  print(name, error.code, error.read(300).decode(errors='replace'))
              except urllib.error.URLError as error:
                  print(name, str(error.reason))
          PY
